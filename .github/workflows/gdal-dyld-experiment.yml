name: GDAL dyld experiment

on:
  push:
    branches: [investigate/gdal-dyld-ci]
    paths:
      - .github/workflows/gdal-dyld-experiment.yml
      - experiments/gdal-dyld/**
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  follow-up:
    if: github.repository == 'maresb/conda-lock'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: cross-process
            os: macos-26
            script: reproduce_cross_process.py
          - label: thread-scrub
            os: macos-26
            script: scrub_probe.py
          - label: filesystem-images
            os: macos-26
            script: image_probe.py
          - label: thread-exit-macos-15
            os: macos-15
            script: reproduce_thread_exit.py
          - label: thread-exit-macos-15-intel
            os: macos-15-intel
            script: reproduce_thread_exit.py
          - label: thread-exit-macos-26-intel
            os: macos-26-intel
            script: reproduce_thread_exit.py
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Record runner
        run: |
          mkdir -p "$RUNNER_TEMP/gdal-dyld"
          { sw_vers; uname -m; /usr/bin/what /usr/lib/dyld; xcrun clang --version; } > "$RUNNER_TEMP/gdal-dyld/host.log"
      - name: Run probe
        env:
          PROBE_SCRIPT: ${{ matrix.script }}
        run: |
          /usr/bin/python3 "experiments/gdal-dyld/$PROBE_SCRIPT" \
            --output "$RUNNER_TEMP/gdal-dyld/probe"
      - name: Collect evidence
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 experiments/gdal-dyld/collect_evidence.py "$RUNNER_TEMP/gdal-dyld"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: gdal-trigger-${{ matrix.label }}
          path: ${{ runner.temp }}/gdal-dyld/evidence
          retention-days: 30
