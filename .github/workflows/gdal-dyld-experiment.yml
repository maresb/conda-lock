name: GDAL dyld experiment

on:
  push:
    branches: [investigate/gdal-dyld-ci]
    paths:
      - .github/workflows/gdal-dyld-experiment.yml
      - experiments/gdal-dyld/**
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trigger:
    if: github.repository == 'maresb/conda-lock'
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: origin-eviction
            timeout: 900
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          init-shell: bash
          micromamba-version: 2.10.0-0
      - name: Record runner
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/gdal-dyld"
          { sw_vers; uname -m; /usr/bin/what /usr/lib/dyld; xcrun clang --version; } > "$RUNNER_TEMP/gdal-dyld/host.log"
      - name: Probe thread origin eviction and link IDs
        run: |
          /usr/bin/python3 experiments/gdal-dyld/alias_probe.py --probe origin \
            --output "$RUNNER_TEMP/gdal-dyld/probe"
      - name: Collect evidence
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 experiments/gdal-dyld/collect_evidence.py "$RUNNER_TEMP/gdal-dyld"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: gdal-trigger-${{ matrix.label }}
          path: ${{ runner.temp }}/gdal-dyld/evidence
          retention-days: 30
