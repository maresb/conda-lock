name: GDAL dyld experiment

on:
  push:
    branches: [investigate/gdal-dyld-ci]
    paths:
      - .github/workflows/gdal-dyld-experiment.yml
      - experiments/gdal-dyld/**
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated job labels to run; empty runs every job
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.repository == 'maresb/conda-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      installer: ${{ steps.plan.outputs.installer }}
      workaround: ${{ steps.plan.outputs.workaround }}
    steps:
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: |
          ALL='[
            {"label": "cross-process", "os": "macos-26", "script": "reproduce_cross_process.py"},
            {"label": "thread-scrub", "os": "macos-26", "script": "scrub_probe.py"},
            {"label": "filesystem-images", "os": "macos-26", "script": "image_probe.py"},
            {"label": "thread-exit-macos-15", "os": "macos-15", "script": "reproduce_thread_exit.py"},
            {"label": "thread-exit-macos-15-intel", "os": "macos-15-intel", "script": "reproduce_thread_exit.py"},
            {"label": "thread-exit-macos-26-intel", "os": "macos-26-intel", "script": "reproduce_thread_exit.py"},
            {"label": "link-cost", "os": "macos-26", "script": "link_cost_probe.py"},
            {"label": "route2-images", "os": "macos-26", "script": "route2_probe.py"},
            {"label": "thread-exit-macos-26", "os": "macos-26", "script": "reproduce_thread_exit.py"},
            {"label": "retained-inode-retry", "os": "macos-26", "script": "retry_probe.py"},
            {"label": "record-probe-v2", "os": "macos-26", "script": "record_probe.py"},
            {"label": "delay-probe", "os": "macos-26", "script": "delay_probe.py"},
            {"label": "respawn-probe", "os": "macos-26", "script": "respawn_probe.py"},
            {"label": "fallback-probe", "os": "macos-26", "script": "fallback_probe.py"},
            {"label": "churn-probe", "os": "macos-26", "script": "churn_probe.py"}
          ]'
          wanted() { [ -z "$ONLY" ] || case ",$ONLY," in *",$1,"*) true ;; *) false ;; esac; }
          if [ -z "$ONLY" ]; then
            MATRIX=$(jq -c . <<<"$ALL")
          else
            MATRIX=$(jq -c --arg only ",$ONLY," '[.[] | select(("," + .label + ",") as $l | $only | contains($l))]' <<<"$ALL")
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "installer=$(wanted installer-identity && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "workaround=$(wanted workaround-validation && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "matrix: $MATRIX"

  follow-up:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Record runner
        run: |
          mkdir -p "$RUNNER_TEMP/gdal-dyld"
          { sw_vers; uname -m; /usr/bin/what /usr/lib/dyld; xcrun clang --version; } > "$RUNNER_TEMP/gdal-dyld/host.log"
      - name: Run probe
        env:
          PROBE_SCRIPT: ${{ matrix.script }}
        run: |
          /usr/bin/python3 "experiments/gdal-dyld/$PROBE_SCRIPT" \
            --output "$RUNNER_TEMP/gdal-dyld/probe"
      - name: Collect evidence
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 experiments/gdal-dyld/collect_evidence.py "$RUNNER_TEMP/gdal-dyld"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: gdal-trigger-${{ matrix.label }}
          path: ${{ runner.temp }}/gdal-dyld/evidence
          retention-days: 30

  installer-identity:
    needs: plan
    if: needs.plan.outputs.installer == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Record runner
        run: |
          mkdir -p "$RUNNER_TEMP/gdal-dyld"
          { sw_vers; uname -m; /usr/bin/what /usr/lib/dyld; xcrun clang --version; } > "$RUNNER_TEMP/gdal-dyld/host.log"
      - name: Storage controls
        run: /usr/bin/python3 experiments/gdal-dyld/installer_identity.py --output "$RUNNER_TEMP/gdal-dyld/probe" --self-check
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          init-shell: none
          micromamba-version: 2.10.0-0
      - name: Micromamba identity
        run: |
          "$MAMBA_EXE" -r "$MAMBA_ROOT_PREFIX" create -y -n gdal-mm -f experiments/gdal-dyld/fixtures/conda-osx-arm64.lock > "$RUNNER_TEMP/gdal-dyld/micromamba-create.log" 2>&1
          /usr/bin/python3 experiments/gdal-dyld/installer_identity.py --output "$RUNNER_TEMP/gdal-dyld/probe" \
            --label micromamba --executable "$MAMBA_ROOT_PREFIX/envs/gdal-mm/bin/gdalinfo" --cache-root "$MAMBA_ROOT_PREFIX/pkgs"
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniconda-version: latest
          auto-activate: false
      - name: Conda identity
        run: |
          "$CONDA/bin/conda" create -y -p "$RUNNER_TEMP/gdal-conda" --file experiments/gdal-dyld/fixtures/conda-osx-arm64.lock > "$RUNNER_TEMP/gdal-dyld/conda-create.log" 2>&1
          PKGS=$("$CONDA/bin/conda" info --json | /usr/bin/python3 -c 'import json, sys; print(json.load(sys.stdin)["pkgs_dirs"][0])')
          echo "conda pkgs_dirs[0]=$PKGS" >> "$RUNNER_TEMP/gdal-dyld/conda-create.log"
          /usr/bin/python3 experiments/gdal-dyld/installer_identity.py --output "$RUNNER_TEMP/gdal-dyld/probe" \
            --label conda --executable "$RUNNER_TEMP/gdal-conda/bin/gdalinfo" --cache-root "$PKGS"
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - name: Pixi identity
        run: |
          mkdir -p "$RUNNER_TEMP/gdal-pixi"
          pixi init "$RUNNER_TEMP/gdal-pixi" > "$RUNNER_TEMP/gdal-dyld/pixi-create.log" 2>&1
          pixi add --manifest-path "$RUNNER_TEMP/gdal-pixi/pixi.toml" gdal >> "$RUNNER_TEMP/gdal-dyld/pixi-create.log" 2>&1
          CACHE=$(pixi info --json | /usr/bin/python3 -c 'import json, sys; print(json.load(sys.stdin)["cache_dir"])')
          /usr/bin/python3 experiments/gdal-dyld/installer_identity.py --output "$RUNNER_TEMP/gdal-dyld/probe" \
            --label pixi --executable "$RUNNER_TEMP/gdal-pixi/.pixi/envs/default/bin/gdalinfo" --cache-root "$CACHE"
      - name: Collect evidence
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 experiments/gdal-dyld/collect_evidence.py "$RUNNER_TEMP/gdal-dyld"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: gdal-trigger-installer-identity
          path: ${{ runner.temp }}/gdal-dyld/evidence
          retention-days: 30

  workaround-validation:
    needs: plan
    if: needs.plan.outputs.workaround == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Record runner
        run: |
          mkdir -p "$RUNNER_TEMP/gdal-dyld"
          { sw_vers; uname -m; /usr/bin/what /usr/lib/dyld; xcrun clang --version; } > "$RUNNER_TEMP/gdal-dyld/host.log"
      - name: Storage controls
        run: /usr/bin/python3 experiments/gdal-dyld/installer_identity.py --output "$RUNNER_TEMP/gdal-dyld/probe" --self-check
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          init-shell: none
          micromamba-version: 2.10.0-0
      - name: Create the integration-test environments with --always-copy, plus a hardlink baseline
        run: |
          cd experiments/gdal-dyld/fixtures
          LOG="$RUNNER_TEMP/gdal-dyld/create.log"
          "$MAMBA_EXE" -r "$MAMBA_ROOT_PREFIX" create -y --always-copy -n gdal-test-mm-lock -f conda-lock.yml >> "$LOG" 2>&1
          "$MAMBA_EXE" -r "$MAMBA_ROOT_PREFIX" create -y --always-copy -n gdal-test-mm-explicit -f conda-osx-arm64.lock >> "$LOG" 2>&1
          "$MAMBA_EXE" -r "$MAMBA_ROOT_PREFIX" create -y --always-copy -n gdal-test-mm-env -f conda-osx-arm64.lock.yml >> "$LOG" 2>&1
          "$MAMBA_EXE" -r "$MAMBA_ROOT_PREFIX" create -y -n gdal-test-mm-hardlink -f conda-osx-arm64.lock >> "$LOG" 2>&1
      - name: Record executable identities and launch each environment
        run: |
          for env in lock explicit env hardlink; do
            /usr/bin/python3 experiments/gdal-dyld/installer_identity.py --output "$RUNNER_TEMP/gdal-dyld/probe" \
              --label "micromamba-$env" --executable "$MAMBA_ROOT_PREFIX/envs/gdal-test-mm-$env/bin/gdalinfo" \
              --cache-root "$MAMBA_ROOT_PREFIX/pkgs"
            "$MAMBA_EXE" -r "$MAMBA_ROOT_PREFIX" run -n "gdal-test-mm-$env" gdalinfo --version >> "$RUNNER_TEMP/gdal-dyld/run.log" 2>&1
          done
          cat "$RUNNER_TEMP/gdal-dyld/run.log"
      - name: Collect evidence
        if: ${{ !cancelled() }}
        run: /usr/bin/python3 experiments/gdal-dyld/collect_evidence.py "$RUNNER_TEMP/gdal-dyld"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: gdal-trigger-workaround-validation
          path: ${{ runner.temp }}/gdal-dyld/evidence
          retention-days: 30
