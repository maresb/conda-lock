name: Observe mapping downloads and worker waits
'on':
  workflow_call: {}
permissions: {}
jobs:
  mapping-control:
    name: Mapping control (${{ matrix.mapping-cache }}, ${{ matrix.pytest-workers }}, ${{ matrix.repeat }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-latest
        python-version:
        - '3.14'
        pytest-split-group-index:
        - 2
        pytest-split-group-size:
        - 4
        pytest-workers:
        - '2'
        - '4'
        repeat:
        - 1
        - 2
        mapping-cache:
        - cold
        - primed
    defaults:
      run:
        shell: bash -eo pipefail -l {0}
    env:
      PYTHONUNBUFFERED: '1'
      FORCE_COLOR: '1'
      PYTEST_OS: ${{ matrix.os }}
      PYTEST_PYTHON: ${{ matrix.python-version }}
      PYTEST_SPLITS: ${{ matrix.pytest-split-group-size }}
      PYTEST_GROUP: ${{ matrix.pytest-split-group-index }}
      PYTEST_WORKERS: ${{ matrix.pytest-workers || 'auto' }}
      METRICS_MATRIX: ${{ toJSON(matrix) }}
      METRICS_INPUTS: ${{ toJSON(inputs) }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up telemetry Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Start resource sampler
      id: metrics
      shell: bash -eo pipefail {0}
      run: |
        python -m venv "$RUNNER_TEMP/ci-metrics-venv"
        if [[ "$RUNNER_OS" == Windows ]]; then
          metrics_python="$RUNNER_TEMP/ci-metrics-venv/Scripts/python.exe"
        else
          metrics_python="$RUNNER_TEMP/ci-metrics-venv/bin/python"
        fi
        "$metrics_python" -m pip install --disable-pip-version-check psutil==7.1.0
        echo "MONITOR_PY=$metrics_python" >> "$GITHUB_ENV"
        "$metrics_python" experiments/ci-performance/telemetry.py start
    - name: Measure Set Conda platform
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: Set Conda platform
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - name: Set Conda platform
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          echo "CONDA_PLATFORM=linux-64" >> $GITHUB_ENV
        elif [ "$RUNNER_OS" == "macOS" ]; then
          echo "CONDA_PLATFORM=osx-arm64" >> $GITHUB_ENV
        elif [ "$RUNNER_OS" == "Windows" ]; then
          echo "CONDA_PLATFORM=win-64" >> $GITHUB_ENV
        fi
    - name: Measure Verify Conda platform
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: Verify Conda platform
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - name: Verify Conda platform
      run: echo "Conda platform is $CONDA_PLATFORM"
    - name: Measure Rename conda-lock-python-${{ matrix.python-version }}.yaml to conda-lock.yml
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: Rename conda-lock-python-${{ matrix.python-version }}.yaml to conda-lock.yml
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - name: Rename conda-lock-python-${{ matrix.python-version }}.yaml to conda-lock.yml
      run: |
        LOCKFILE_DIR="${RUNNER_TEMP}/conda-lock-dir"
        mkdir -p "${LOCKFILE_DIR}"
        cp environments/conda-lock-python-${PYTEST_PYTHON}.yaml "${LOCKFILE_DIR}/conda-lock.yml"
        echo "LOCKFILE_DIR=${LOCKFILE_DIR}"
        ls -al "${LOCKFILE_DIR}"
        echo "LOCKFILE_DIR=${LOCKFILE_DIR}" >> $GITHUB_ENV
    - name: Measure mamba-org/setup-micromamba
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: mamba-org/setup-micromamba
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462
      with:
        environment-file: ${{ env.LOCKFILE_DIR }}/conda-lock.yml
        environment-name: conda-lock-dev
        init-shell: bash
        cache-environment: true
        create-args: --category=main --category=dev
        cache-environment-key: ci-perf-20261104-candidate-${{ matrix.os }}-py${{ matrix.python-version }}
    - name: Measure install conda-lock
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: install conda-lock
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - name: install conda-lock
      run: |
        which pip
        pip install -e . --no-deps
    - name: Measure run pip check
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: run pip check
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - name: run pip check
      run: pip check
    - name: Measure Prepare mapping cache
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: Prepare mapping cache
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - name: Prepare mapping cache
      env:
        MAPPING_CACHE_STATE: ${{ matrix.mapping-cache }}
        MAPPING_TRACE_DIR: ${{ runner.temp }}/ci-metrics
      run: python experiments/ci-performance/mapping_probe.py prepare --state "$MAPPING_CACHE_STATE"
    - name: Measure run-test
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: run-test
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - name: run-test
      run: |
        mkdir -p tests/durations
        set -x
        which pytest
        python experiments/ci-performance/mapping_probe.py pytest --numprocesses="$PYTEST_WORKERS" \
          --cov=conda_lock --cov-branch --cov-report=xml --cov-report=term \
          --store-durations \
          --clean-durations \
          --durations-path "tests/durations/${PYTEST_OS}-py${PYTEST_PYTHON}.json" \
          --splitting-algorithm=least_duration \
          --splits="${PYTEST_SPLITS}" \
          --group="${PYTEST_GROUP}"
      env:
        MAPPING_TRACE_DIR: ${{ runner.temp }}/ci-metrics
    - name: Measure Print test durations
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: Print test durations
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - name: Print test durations
      run: |
        ls -al tests/durations
        cat tests/durations/${PYTEST_OS}-py${PYTEST_PYTHON}.json
    - name: Measure Store test durations
      shell: bash -eo pipefail {0}
      env:
        METRICS_PHASE: Store test durations
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py mark --label "$METRICS_PHASE"'
    - name: Preserve shard durations with measurements
      shell: bash -eo pipefail {0}
      run: cp "tests/durations/${PYTEST_OS}-py${PYTEST_PYTHON}.json" "$RUNNER_TEMP/ci-metrics/test-durations.json"
    - name: Stop resource sampler
      if: always() && steps.metrics.outcome == 'success'
      shell: bash -eo pipefail {0}
      run: '"$MONITOR_PY" experiments/ci-performance/telemetry.py stop'
    - name: Upload resource measurements
      if: always() && steps.metrics.outcome == 'success'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: metrics-${{ env.METRICS_ID }}
        path: ${{ runner.temp }}/ci-metrics
        if-no-files-found: error
