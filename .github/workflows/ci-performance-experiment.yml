        "python-version": "3.14", "pytest-split-group-index": 2, "pytest-split-group-size": 3}, {"os": "ubuntu-latest", "python-version":
        "3.14", "pytest-split-group-index": 3, "pytest-split-group-size": 3}, {"os": "macos-latest", "python-version": "3.11",
        "pytest-split-group-index": 1, "pytest-split-group-size": 4}, {"os": "macos-latest", "python-version": "3.11", "pytest-split-group-index":
        2, "pytest-split-group-size": 4}, {"os": "macos-latest", "python-version": "3.11", "pytest-split-group-index": 3,
        "pytest-split-group-size": 4}, {"os": "macos-latest", "python-version": "3.11", "pytest-split-group-index": 4, "pytest-split-group-size":
        4}, {"os": "macos-latest", "python-version": "3.14", "pytest-split-group-index": 1, "pytest-split-group-size": 4},
        {"os": "macos-latest", "python-version": "3.14", "pytest-split-group-index": 2, "pytest-split-group-size": 4}, {"os":
        "macos-latest", "python-version": "3.14", "pytest-split-group-index": 3, "pytest-split-group-size": 4}, {"os": "macos-latest",
        "python-version": "3.14", "pytest-split-group-index": 4, "pytest-split-group-size": 4}, {"os": "windows-latest", "python-version":
        "3.11", "pytest-split-group-index": 1, "pytest-split-group-size": 4}, {"os": "windows-latest", "python-version": "3.11",
        "pytest-split-group-index": 2, "pytest-split-group-size": 4}, {"os": "windows-latest", "python-version": "3.11", "pytest-split-group-index":
        3, "pytest-split-group-size": 4}, {"os": "windows-latest", "python-version": "3.11", "pytest-split-group-index": 4,
        "pytest-split-group-size": 4}, {"os": "windows-latest", "python-version": "3.14", "pytest-split-group-index": 1, "pytest-split-group-size":
        4}, {"os": "windows-latest", "python-version": "3.14", "pytest-split-group-index": 2, "pytest-split-group-size": 4},
        {"os": "windows-latest", "python-version": "3.14", "pytest-split-group-index": 3, "pytest-split-group-size": 4}, {"os":
        "windows-latest", "python-version": "3.14", "pytest-split-group-index": 4, "pytest-split-group-size": 4}]}'
      cache-group: candidate
  candidate-integration:
    permissions:
      contents: read
      actions: write
    needs: configure
    if: needs.configure.outputs.mode == 'candidate'
    uses: ./.github/workflows/ci-perf-integration-candidate.yml
  windows-control:
    needs: configure
    if: needs.configure.outputs.mode == 'windows-control'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci-perf-windows-control.yml
  macos-probe:
    needs: configure
    if: needs.configure.outputs.mode == 'macos-probe'
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-latest
        - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
    - run: |
        sw_vers
        uname -m
        sysctl -n hw.ncpu
