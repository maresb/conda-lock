  baseline-integration:
    permissions:
      contents: read
      actions: write
    needs: configure
    if: needs.configure.outputs.mode == 'baseline'
    uses: ./.github/workflows/ci-perf-integration-baseline.yml
  candidate-pytest:
    permissions:
      contents: read
      actions: write
    needs: configure
    if: needs.configure.outputs.mode == 'candidate'
    uses: ./.github/workflows/ci-perf-pytest.yml
    with:
      matrix: '{"include": [{"os": "ubuntu-latest", "python-version": "3.11", "pytest-split-group-index": 1, "pytest-split-group-size":
